name: API tests in Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Собрать образ
        run: docker build -t api-test .

      - name: Запустить тесты
        run: docker run --rm api-test
